<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Generator QR Siswa</title>

<link rel="stylesheet" href="generator.css">

</head>

<body>

<div class="card">

<h1>GENERATOR QR SISWA</h1>

<h2>SMPN 4 PADAHERANG</h2>

<input
id="nisCari"
type="text"
placeholder="Masukkan NIS">

<button id="btnCari">

Cari Siswa

</button>

<div id="hasil"></div>

<div id="kartuQR" class="kartu" style="display:none;">

    <div class="header">

    <img src="logo.png" class="logo">

    <h2>SMPN 4 PADAHERANG</h2>

    <p>KARTU ABSENSI QR</p>

</div>

    <div class="isi">

        <p><b>Nama :</b> <span id="kNama"></span></p>

        <p><b>NIS :</b> <span id="kNis"></span></p>

        <p><b>Kelas :</b> <span id="kKelas"></span></p>

        <div id="qrArea"></div>

        <p class="keteranganQR">
    Scan QR ini untuk absensi<br>
    SMPN 4 Padaherang<br>
    <b>Berlaku selama menjadi siswa</b>
</p>

        <br>

    </div>

</div>

<div class="aksi">

    <button id="btnCetak" class="btnCetak">
        🖨️ Cetak Kartu
    </button>

    <button id="btnDownload" class="btnCetak">
        📥 Download PNG
    </button>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="generator.js"></script>

</body>
</html>
