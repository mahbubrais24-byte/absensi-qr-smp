<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Absensi QR SMPN 4 Padaherang</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<div class="top-bar"></div>

<h1>ABSENSI QR</h1>

<h2>SMPN 4 PADAHERANG</h2>

<div id="jamDigital" class="jam">
    Memuat waktu...
</div>

<div class="statistik">

    <div class="boxStat">

        👥 Masuk<br>

        <span id="jmlMasuk">0</span>

    </div>

    <div class="boxStat">

        🏠 Pulang<br>

        <span id="jmlPulang">0</span>

    </div>

</div>

<div class="info">

<p><b>Nama :</b> <span id="nama">-</span></p>

<p><b>NIS :</b> <span id="nis">-</span></p>

<p><b>Kelas :</b> <span id="kelas">-</span></p>

</div>

<div id="status">

Menunggu Scan...

</div>

<div id="reader">

Kamera akan tampil di sini

</div>

<div class="tombol">

<button id="btnMasuk">
  👤 ABSEN MASUK
</button>

<button id="btnPulang">
  🏠 ABSEN PULANG
</button>

</div>

</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script src="script.js"></script>

</html>
