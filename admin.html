<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Dashboard Admin - Absensi QR
  </title>

  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #16213e,
          #243b78
        );

      padding: 20px;

    }


    .dashboard {

      width: 100%;

      max-width: 1100px;

      margin: auto;

      background: white;

      border-radius: 20px;

      padding: 30px;

      box-shadow:
        0 15px 40px
        rgba(0,0,0,0.25);

    }


    .header {

      text-align: center;

      margin-bottom: 30px;

    }


    .header h1 {

      margin: 5px 0;

      color: #2457d6;

      font-size: 30px;

    }


    .header h2 {

      margin: 5px 0 15px;

      color: #333;

      font-size: 20px;

    }


    #namaAdmin {

      font-size: 18px;

      font-weight: bold;

      color: #555;

    }


    .menu {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 18px;

      margin-top: 30px;

    }


    .menu button {

      min-height: 140px;

      border: none;

      border-radius: 16px;

      background: #f1f5ff;

      border:
        2px solid #dbe4ff;

      color: #2457d6;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;

    }


    .menu button:hover {

      background: #e3ebff;

      transform:
        translateY(-3px);

    }


    .menu .logout {

      color: #dc3545;

      background: #fff1f1;

      border-color: #ffd6d6;

    }


    #konten {

      margin-top: 30px;

      padding: 25px;

      min-height: 100px;

      border-radius: 15px;

      background: #f8faff;

      border:
        1px solid #dbe4ff;

      text-align: center;

      color: #444;

    }


    @media(max-width:700px) {

      .dashboard {

        padding: 20px;

      }


      .menu {

        grid-template-columns:
          repeat(2, 1fr);

      }

    }


    @media(max-width:450px) {

      .menu {

        grid-template-columns: 1fr;

      }


      .header h1 {

        font-size: 25px;

      }

    }

  </style>

</head>


<body>


  <div class="dashboard">


    <!-- =========================================
         HEADER
    ========================================== -->

    <div class="header">

      <h1>
        SISTEM ABSENSI QR
      </h1>

      <h2>
        SMPN 4 PADAHERANG
      </h2>

      <div id="namaAdmin">
        Selamat datang, Administrator
      </div>

    </div>


    <!-- =========================================
         MENU
    ========================================== -->

    <div class="menu">


      <button
        onclick="bukaScanner()"
      >

        📷<br><br>

        Scanner QR

      </button>


      <button
        onclick="bukaGenerator()"
      >

        🔳<br><br>

        Generator QR

      </button>


      <button
        onclick="bukaSiswa()"
      >

        👨‍🎓<br><br>

        Data Siswa

      </button>


      <button
        onclick="bukaAbsensi()"
      >

        📝<br><br>

        Data Absensi

      </button>


      <button
        onclick="bukaStatistik()"
      >

        📊<br><br>

        Statistik

      </button>


      <button
        class="logout"
        onclick="logout()"
      >

        🚪<br><br>

        Logout

      </button>


    </div>


    <!-- =========================================
         AREA KONTEN
    ========================================== -->

    <div id="konten">

      Pilih menu di atas.

    </div>


  </div>


  <script>


// ==================================================
// TEST JAVASCRIPT DASHBOARD
// ==================================================

window.bukaScanner = function () {

  window.location.href = "index.html";

};


window.bukaGenerator = function () {

  window.location.href = "generator.html";

};


window.bukaSiswa = function () {

  document.getElementById("konten").innerHTML = `

    <h2>👨‍🎓 DATA SISWA</h2>

    <p>
      Fitur Data Siswa siap digunakan.
    </p>

  `;

};


window.bukaAbsensi = function () {

  document.getElementById("konten").innerHTML = `

    <h2>📝 DATA ABSENSI</h2>

    <p>
      Fitur Data Absensi siap digunakan.
    </p>

  `;

};


window.bukaStatistik = function () {

  document.getElementById("konten").innerHTML = `

    <h2>📊 STATISTIK</h2>

    <p>
      Fitur Statistik siap digunakan.
    </p>

  `;

};


window.logout = function () {

  sessionStorage.removeItem("adminLogin");

  sessionStorage.removeItem("adminNama");

  sessionStorage.removeItem("adminLevel");

  window.location.href = "login.html";

};


console.log(
  "✅ JAVASCRIPT DASHBOARD AKTIF"
);

</script>

</body>

</html>
