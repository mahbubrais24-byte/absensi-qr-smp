<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Dashboard Admin - Absensi QR
  </title>

  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #16213e,
          #243b78

      padding: 20px;

    }


    .dashboard {

      width: 100%;

      max-width: 1100px;

      margin: auto;

      background: white;

      border-radius: 20px;

      padding: 30px;

      box-shadow:
        0 15px 40px
        rgba(0,0,0,0.25);

    .header {

      text-align: center;

      margin-bottom: 30px;

    }


    .header h1 {

      margin: 5px 0;

      color: #2457d6;

      font-size: 30px;

    }


    .header h2 {

      margin: 5px 0 15px;

      color: #333;

      font-size: 20px;

    }


    #namaAdmin {

      font-size: 18px;

      font-weight: bold;

      color: #555;

    }


    .menu {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 18px;

      margin-top: 30px;

    }


    .menu button {

      min-height: 140px;

      border: none;

      border-radius: 16px;

      background: #f1f5ff;

      border:
        2px solid #dbe4ff;

      color: #2457d6;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;

    }


    .menu button:hover {

      background: #e3ebff;

      transform:
        translateY(-3px);

    }


    .menu .logout {

      color: #dc3545;

      background: #fff1f1;

      border-color: #ffd6d6;

    }


    #konten {

      margin-top: 30px;

      padding: 25px;

      min-height: 100px;

      border-radius: 15px;

      background: #f8faff;

      border:
        1px solid #dbe4ff;

      text-align: center;

      color: #444;

    }


    @media(max-width:700px) {

      .dashboard {

        padding: 20px;

      }


      .menu {

        grid-template-columns:
          repeat(2, 1fr);

      }

    }


    @media(max-width:450px) {

      .menu {

        grid-template-columns: 1fr;

      }


      .header h1 {

        font-size: 25px;

      }

    }

  </style>

</head>

// ==================================================
// DATA SISWA FINAL
// ==================================================

var dataSiswaGlobal = [];


window.bukaSiswa = function () {

  var konten =
    document.getElementById("konten");


  konten.innerHTML = `

    <div
      style="
        text-align:left;
      "
    >

      <h2
        style="
          text-align:center;
          color:#2457d6;
        "
      >
        👨‍🎓 DATA SISWA
      </h2>


      <div
        id="jumlahSiswa"

          font-size:18px;

        "
      >
        ⏳ Memuat data siswa...
      </div>


      <input
        type="text"
        id="cariSiswa"
        placeholder="🔎 Cari NIS, nama, atau kelas..."
        oninput="filterSiswa()"

                No
              </th>

                NIS
              </th>

              <th style="padding:12px">
                Nama
              </th>

              <th style="padding:12px">
                Jenis Kelamin
              </th>

              <th style="padding:12px">
                Kelas
              </th>

            </tr>

          </thead>


          <tbody id="bodySiswa">

            <tr>

              <td
                colspan="5"

// ==================================================
// AMBIL DATA SISWA
// ==================================================

function ambilDataSiswa() {

  var body =
    document.getElementById(
      "bodySiswa"
    );


  if (!body) {
    return;
  }


  body.innerHTML = `

    <tr>

      <td
        colspan="5"
        style="
          padding:25px;
          text-align:center;
        "
      >
        ⏳ Mengambil data siswa...
      </td>

    </tr>

  `;


  var API_URL =
    "https://script.google.com/macros/s/AKfycbzF-dkz-qiprRO1UiBXip0LzojGuAAdGyvYuCYEVEiDbh0l1r5-uKfqkouPwzceK-bD/exec";


  fetch(
    API_URL +
    "?api=datasiswa"
  )

  .then(function(response) {

    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    return response.json();

  })

  .then(function(hasil) {

    console.log(
      "DATA SISWA:",
      hasil
    );


    if (
      !hasil ||
      hasil.status !== true
    ) {

      throw new Error(
        hasil && hasil.pesan
          ? hasil.pesan
          : "Data siswa gagal diambil."
      );

    }


    dataSiswaGlobal =
      hasil.siswa || [];


    var jumlah =
      document.getElementById(
        "jumlahSiswa"
      );


    if (jumlah) {

      jumlah.innerHTML =
        "👨‍🎓 Total Siswa: " +
        dataSiswaGlobal.length;

    }


    tampilkanSiswa(
      dataSiswaGlobal
    );

  })

  .catch(function(error) {

    console.error(
      "ERROR DATA SISWA:",
      error
    );


    body.innerHTML = `

      <tr>

        <td
          colspan="5"
          style="
            padding:25px;
            text-align:center;
            color:red;
            font-weight:bold;
          "
        >

          ❌ Gagal mengambil data siswa.

          <br><br>

          ${error.message}

        </td>

      </tr>

    `;

  });

}


// ==================================================
// TAMPILKAN DATA SISWA
// ==================================================

function tampilkanSiswa(data) {

  var body =
    document.getElementById(
      "bodySiswa"
    );


  if (!body) {
    return;
  }


  if (
    !data ||
    data.length === 0
  ) {

    body.innerHTML = `

      <tr>

        <td
          colspan="5"
          style="
            padding:25px;
            text-align:center;
          "
        >
          Data siswa tidak ditemukan.
        </td>

      </tr>

    `;

    return;

  }


  var html = "";


  data.forEach(
    function(siswa, index) {

      html += `

        <tr
          style="
            border-bottom:1px solid #ddd;
          "
        >

          <td
            style="
              padding:10px;
              text-align:center;
            "
          >
            ${index + 1}
          </td>


          <td style="padding:10px">
            ${siswa.nis || ""}
          </td>


          <td
            style="
              padding:10px;
              font-weight:bold;
            "
          >
            ${siswa.nama || ""}
          </td>


          <td
            style="
              padding:10px;
              text-align:center;
            "
          >
            ${siswa.jk || ""}
          </td>


          <td
            style="
              padding:10px;
              text-align:center;
            "
          >
            ${siswa.kelas || ""}
          </td>

        </tr>

      `;

    }
  );


  body.innerHTML =
    html;

}


// ==================================================
// PENCARIAN SISWA
// ==================================================

window.filterSiswa = function () {

  var input =
    document.getElementById(
      "cariSiswa"
    );


  if (!input) {
    return;
  }


  var keyword =
    input.value
      .toLowerCase()
      .trim();


  var hasil =
    dataSiswaGlobal.filter(
      function(siswa) {

        var nis =
          String(
            siswa.nis || ""
          ).toLowerCase();


        var nama =
          String(
            siswa.nama || ""
          ).toLowerCase();


        var kelas =
          String(
            siswa.kelas || ""
          ).toLowerCase();


        return (
          nis.includes(keyword) ||
          nama.includes(keyword) ||
          kelas.includes(keyword)
        );

      }
    );


  tampilkanSiswa(
    hasil
  );

};


// ==================================================
// KEMBALI KE DASHBOARD
// ==================================================

};

      </div>

      <div class="statistik-kartu">

        <div class="kartu"><div class="kartu-icon">🟢</div><div id="statSudahAbsenFinal" class="kartu-angka">0</div><div class="kartu-label">SUDAH ABSEN</div></div>

        </div>
        <div class="statistik-scroll">
          <table id="tabelBelumAbsenFinal" class="tabel-final">
            <thead><tr><th>No</th><th>NIS</th><th>Nama</th><th>Kelas</th></tr></thead>
            <tbody><tr><td colspan="4">Memuat data...</td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="statistik-box">
        <div class="statistik-box-header">
          🟠 SISWA TERLAMBAT (<span id="jumlahTerlambatFinal">0</span>)
        </div>
        <div class="statistik-scroll">
          <table id="tabelTerlambatFinal" class="tabel-final">
            <thead><tr><th>No</th><th>NIS</th><th>Nama</th><th>Kelas</th></tr></thead>
            <tbody><tr><td colspan="4">Memuat data...</td></tr></tbody>

        <div class="statistik-scroll">

const API_STATISTIK_FINAL =
  "https://script.google.com/macros/s/AKfycbzF-dkz-qiprRO1UiBXip0LzojGuAAdGyvYuCYEVEiDbh0l1r5-uKfqkouPwzceK-bD/exec";


function muatStatistikFinal() {

  var tombol = document.getElementById("btnRefreshStatistikFinal");

  if (tombol) {
    tombol.disabled = true;
    tombol.innerHTML = "⏳ MEMUAT...";
  }

  fetch(API_STATISTIK_FINAL + "?api=statistik")
    .then(function(response) {
      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }
      return response.json();
    })
    .then(function(data) {

      console.log("DATA STATISTIK:", data);

      if (!data || data.status !== true) {
        throw new Error(
          data && data.pesan ? data.pesan :
          "Data statistik tidak tersedia."
        );
      }

      setStatistikFinal("statistikTanggalFinal", "Tanggal: " + (data.tanggal || "-"));
      setStatistikFinal("statTotalFinal", data.totalSiswa || 0);
      setStatistikFinal("statSudahAbsenFinal", data.sudahAbsen || 0);
      setStatistikFinal("statBelumAbsenFinal", data.belumAbsen || 0);
      setStatistikFinal("statTepatWaktuFinal", data.tepatWaktu || 0);
      setStatistikFinal("statTerlambatFinal", data.terlambat || 0);
      setStatistikFinal("statSudahPulangFinal", data.sudahPulang || 0);
      setStatistikFinal("statBelumPulangFinal", data.belumPulang || 0);
      setStatistikFinal("statPulangCepatFinal", data.pulangCepat || 0);
      setStatistikFinal("statSesuaiJadwalFinal", data.sesuaiJadwal || 0);

      tampilPerKelasFinal(data.perKelas || []);
      tampilDaftarFinal("tabelBelumAbsenFinal", "jumlahBelumAbsenFinal", data.daftarBelumAbsen || [], "Semua siswa sudah absen.");
      tampilDaftarFinal("tabelTerlambatFinal", "jumlahTerlambatFinal", data.daftarTerlambat || [], "Tidak ada siswa terlambat.");
      tampilDaftarFinal("tabelPulangCepatFinal", "jumlahPulangCepatFinal", data.daftarPulangCepat || [], "Tidak ada siswa pulang cepat.");

    })
    .catch(function(error) {
      console.error("ERROR STATISTIK:", error);
      alert("❌ Gagal mengambil data statistik.\n\n" + error.message);
    })
    .finally(function() {
      if (tombol) {
        tombol.disabled = false;
        tombol.innerHTML = "🔄 REFRESH DATA";
      }
    });
}


function setStatistikFinal(id, value) {
  var element = document.getElementById(id);
  if (element) element.textContent = value;
}


function tampilPerKelasFinal(data) {

  var tbody = document.querySelector("#tabelPerKelasFinal tbody");
  if (!tbody) return;

  tbody.innerHTML = "";

  if (!data || data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="9">Rekap per kelas belum tersedia dari API.</td></tr>`;
    return;
  }

  data.forEach(function(item, index) {

    var tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${index + 1}</td>
      <td><strong>${escapeStatistikFinal(item.kelas)}</strong></td>
      <td>${item.total || 0}</td>
      <td>${item.sudahAbsen || 0}</td>
      <td>${item.belumAbsen || 0}</td>
      <td>${item.tepatWaktu || 0}</td>
      <td>${item.terlambat || 0}</td>
      <td>${item.sudahPulang || 0}</td>
      <td>${item.belumPulang || 0}</td>
    `;

    tbody.appendChild(tr);
  });
}


function tampilDaftarFinal(tableId, jumlahId, data, pesanKosong) {

  var tbody = document.querySelector("#" + tableId + " tbody");
  if (!tbody) return;

  setStatistikFinal(jumlahId, data.length);
  tbody.innerHTML = "";

  if (!data || data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4">🟢 ${pesanKosong}</td></tr>`;
    return;
  }

  data.forEach(function(item, index) {

    var tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${index + 1}</td>
      <td>${escapeStatistikFinal(item.nis)}</td>
      <td style="text-align:left;">${escapeStatistikFinal(item.nama)}</td>
      <td>${escapeStatistikFinal(item.kelas)}</td>
    `;

    tbody.appendChild(tr);
  });
}


function escapeStatistikFinal(value) {

  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function pasangCSSStatistikFinal() {

  if (document.getElementById("cssStatistikFinal")) return;

  var style = document.createElement("style");
  style.id = "cssStatistikFinal";

  style.innerHTML = `

      width:100%;
      padding:5px;
      box-sizing:border-box;
      text-align:left;
    }

    .statistik-judul {
      text-align:center;
      margin-bottom:25px;
    }

    .statistik-judul h2 {
      color:#2457d6;
      margin:5px 0 10px;
      font-size:28px;
    }

    .statistik-tanggal {
      color:#555;
      font-size:16px;
      margin-bottom:15px;
    }

    .btn-refresh-final {
      border:none;
      border-radius:10px;
      padding:11px 20px;
      background:#2457d6;
      color:white;
      font-weight:bold;
      cursor:pointer;
      font-size:15px;
    }

    .btn-refresh-final:disabled {
      opacity:.6;
      cursor:wait;
    }

    .statistik-kartu {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:15px;
      margin-bottom:25px;
    }

    .kartu {
      background:#f1f5ff;
      border:2px solid #dbe4ff;
      border-radius:15px;
      padding:20px 10px;
      text-align:center;
    }

    .kartu-icon {
      font-size:28px;
      margin-bottom:5px;
    }

    .kartu-angka {
      color:#2457d6;
      font-size:34px;
      font-weight:bold;
    }

    .kartu-label {
      margin-top:5px;
      color:#444;
      font-size:13px;
      font-weight:bold;
