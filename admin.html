<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Dashboard Admin - Absensi QR
  </title>

  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #16213e,
          #243b78
        );

      padding: 20px;

    }


    .dashboard {

      width: 100%;

      max-width: 1100px;

      margin: auto;

      background: white;

      border-radius: 20px;

      padding: 30px;

      box-shadow:
        0 15px 40px
        rgba(0,0,0,0.25);

    }


    .header {

      text-align: center;

      margin-bottom: 30px;

    }


    .header h1 {

      margin: 5px 0;

      color: #2457d6;

      font-size: 30px;

    }


    .header h2 {

      margin: 5px 0 15px;

      color: #333;

      font-size: 20px;

    }


    #namaAdmin {

      font-size: 18px;

      font-weight: bold;

      color: #555;

    }


    .menu {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 18px;

      margin-top: 30px;

    }


    .menu button {

      min-height: 140px;

      border: none;

      border-radius: 16px;

      background: #f1f5ff;

      border:
        2px solid #dbe4ff;

      color: #2457d6;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;

    }


    .menu button:hover {

      background: #e3ebff;

      transform:
        translateY(-3px);

    }


    .menu .logout {

      color: #dc3545;

      background: #fff1f1;

      border-color: #ffd6d6;

    }


    #konten {

      margin-top: 30px;

      padding: 25px;

      min-height: 100px;

      border-radius: 15px;

      background: #f8faff;

      border:
        1px solid #dbe4ff;

      text-align: center;

      color: #444;

    }


    @media(max-width:700px) {

      .dashboard {

        padding: 20px;

      }


      .menu {

        grid-template-columns:
          repeat(2, 1fr);

      }

    }


    @media(max-width:450px) {

      .menu {

        grid-template-columns: 1fr;

      }


      .header h1 {

        font-size: 25px;

      }

    }

  </style>

</head>


<body>


  <div class="dashboard">


    <!-- =========================================
         HEADER
    ========================================== -->

    <div class="header">

      <h1>
        SISTEM ABSENSI QR
      </h1>

      <h2>
        SMPN 4 PADAHERANG
      </h2>

      <div id="namaAdmin">
        Selamat datang, Administrator
      </div>

    </div>


    <!-- =========================================
         MENU
    ========================================== -->

    <div class="menu">


      <button type="button"
        onclick="window.bukaScanner()"
      >

        📷<br><br>

        Scanner QR

      </button>


      <button type="button"
        onclick="window.bukaGenerator()"
      >

        🔳<br><br>

        Generator QR

      </button>


      <button type="button"
        onclick="window.bukaSiswa()"
      >

        👨‍🎓<br><br>

        Data Siswa

      </button>


      <button type="button"
        onclick="window.bukaAbsensi()"
      >

        📝<br><br>

        Data Absensi

      </button>


      <button type="button"
        onclick="window.bukaStatistik()"
      >

        📊<br><br>

        Statistik

      </button>


      <button type="button"
        class="logout"
        onclick="window.logout()"
      >

        🚪<br><br>

        Logout

      </button>


    </div>


    <!-- =========================================
         AREA KONTEN
    ========================================== -->

    <div id="konten">

      Pilih menu di atas.

    </div>


  </div>


  <script>


// ==================================================
// TEST JAVASCRIPT DASHBOARD
// ==================================================

window.bukaScanner = function () {

  window.location.href = "index.html";

};


window.bukaGenerator = function () {

  window.location.href = "generator.html";

};


// ==================================================
// DATA SISWA FINAL
// ==================================================

var dataSiswaGlobal = [];


window.bukaSiswa = function () {

  var konten =
    document.getElementById("konten");


  konten.innerHTML = `

    <div
      style="
        text-align:left;
      "
    >

      <h2
        style="
          text-align:center;
          color:#2457d6;
        "
      >
        👨‍🎓 DATA SISWA
      </h2>


      <div
        id="jumlahSiswa"
        style="
          text-align:center;
          font-size:18px;
          font-weight:bold;
          color:#2457d6;
          margin:15px 0;
        "
      >
        ⏳ Memuat data siswa...
      </div>


      <input
        type="text"
        id="cariSiswa"
        placeholder="🔎 Cari NIS, nama, atau kelas..."
        oninput="filterSiswa()"
        style="
          width:100%;
          padding:14px;
          border:2px solid #ddd;
          border-radius:12px;
          font-size:16px;
          margin-bottom:15px;
          outline:none;
        "
      >


      <div
        style="
          overflow-x:auto;
          background:white;
          border-radius:12px;
          border:1px solid #ddd;
        "
      >

        <table
          style="
            width:100%;
            border-collapse:collapse;
            min-width:650px;
          "
        >

          <thead>

            <tr
              style="
                background:#2457d6;
                color:white;
              "
            >

              <th style="padding:12px">
                No
              </th>

              <th style="padding:12px">
                NIS
              </th>

              <th style="padding:12px">
                Nama
              </th>

              <th style="padding:12px">
                Jenis Kelamin
              </th>

              <th style="padding:12px">
                Kelas
              </th>

            </tr>

          </thead>


          <tbody id="bodySiswa">

            <tr>

              <td
                colspan="5"
                style="
                  padding:25px;
                  text-align:center;
                "
              >
                ⏳ Mengambil data dari server...
              </td>

            </tr>

          </tbody>

        </table>

      </div>


      <div
        style="
          display:flex;
          gap:10px;
          justify-content:center;
          margin-top:20px;
          flex-wrap:wrap;
        "
      >

        <button
          onclick="ambilDataSiswa()"
          style="
            width:auto;
            padding:12px 22px;
            font-size:16px;
          "
        >
          🔄 REFRESH
        </button>


        <button
          onclick="kembaliDashboard()"
          style="
            width:auto;
            padding:12px 22px;
            font-size:16px;
            background:#6c757d;
          "
        >
          ← KEMBALI
        </button>

      </div>

    </div>

  `;


  ambilDataSiswa();

};


// ==================================================
// AMBIL DATA SISWA
// ==================================================

function ambilDataSiswa() {

  var body =
    document.getElementById(
      "bodySiswa"
    );


  if (!body) {
    return;
  }


  body.innerHTML = `

    <tr>

      <td
        colspan="5"
        style="
          padding:25px;
          text-align:center;
        "
      >
        ⏳ Mengambil data siswa...
      </td>

    </tr>

  `;


  var API_URL =
    "https://script.google.com/macros/s/AKfycbzF-dkz-qiprRO1UiBXip0LzojGuAAdGyvYuCYEVEiDbh0l1r5-uKfqkouPwzceK-bD/exec";


  fetch(
    API_URL +
    "?api=datasiswa"
  )

  .then(function(response) {

    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    return response.json();

  })

  .then(function(hasil) {

    console.log(
      "DATA SISWA:",
      hasil
    );


    if (
      !hasil ||
      hasil.status !== true
    ) {

      throw new Error(
        hasil && hasil.pesan
          ? hasil.pesan
          : "Data siswa gagal diambil."
      );

    }


    dataSiswaGlobal =
      hasil.siswa || [];


    var jumlah =
      document.getElementById(
        "jumlahSiswa"
      );


    if (jumlah) {

      jumlah.innerHTML =
        "👨‍🎓 Total Siswa: " +
        dataSiswaGlobal.length;

    }


    tampilkanSiswa(
      dataSiswaGlobal
    );

  })

  .catch(function(error) {

    console.error(
      "ERROR DATA SISWA:",
      error
    );


    body.innerHTML = `

      <tr>

        <td
          colspan="5"
          style="
            padding:25px;
            text-align:center;
            color:red;
            font-weight:bold;
          "
        >

          ❌ Gagal mengambil data siswa.

          <br><br>

          ${error.message}

        </td>

      </tr>

    `;

  });

}


// ==================================================
// TAMPILKAN DATA SISWA
// ==================================================

function tampilkanSiswa(data) {

  var body =
    document.getElementById(
      "bodySiswa"
    );


  if (!body) {
    return;
  }


  if (
    !data ||
    data.length === 0
  ) {

    body.innerHTML = `

      <tr>

        <td
          colspan="5"
          style="
            padding:25px;
            text-align:center;
          "
        >
          Data siswa tidak ditemukan.
        </td>

      </tr>

    `;

    return;

  }


  var html = "";


  data.forEach(
    function(siswa, index) {

      html += `

        <tr
          style="
            border-bottom:1px solid #ddd;
          "
        >

          <td
            style="
              padding:10px;
              text-align:center;
            "
          >
            ${index + 1}
          </td>


          <td style="padding:10px">
            ${siswa.nis || ""}
          </td>


          <td
            style="
              padding:10px;
              font-weight:bold;
            "
          >
            ${siswa.nama || ""}
          </td>


          <td
            style="
              padding:10px;
              text-align:center;
            "
          >
            ${siswa.jk || ""}
          </td>


          <td
            style="
              padding:10px;
              text-align:center;
            "
          >
            ${siswa.kelas || ""}
          </td>

        </tr>

      `;

    }
  );


  body.innerHTML =
    html;

}


// ==================================================
// PENCARIAN SISWA
// ==================================================

window.filterSiswa = function () {

  var input =
    document.getElementById(
      "cariSiswa"
    );


  if (!input) {
    return;
  }


  var keyword =
    input.value
      .toLowerCase()
      .trim();


  var hasil =
    dataSiswaGlobal.filter(
      function(siswa) {

        var nis =
          String(
            siswa.nis || ""
          ).toLowerCase();


        var nama =
          String(
            siswa.nama || ""
          ).toLowerCase();


        var kelas =
          String(
            siswa.kelas || ""
          ).toLowerCase();


        return (
          nis.includes(keyword) ||
          nama.includes(keyword) ||
          kelas.includes(keyword)
        );

      }
    );


  tampilkanSiswa(
    hasil
  );

};


// ==================================================
// KEMBALI KE DASHBOARD
// ==================================================

window.kembaliDashboard = function () {

  location.reload();

};


window.bukaAbsensi = function () {

  document.getElementById("konten").innerHTML = `

    <h2>📝 DATA ABSENSI</h2>

    <p>
      Fitur Data Absensi siap digunakan.
    </p>

  `;

};


window.bukaStatistik = function () {

  document.getElementById("konten").innerHTML = `

    <h2>📊 STATISTIK</h2>

    <p>
      Fitur Statistik siap digunakan.
    </p>

  `;

};


window.logout = function () {

  sessionStorage.removeItem("adminLogin");

  sessionStorage.removeItem("adminNama");

  sessionStorage.removeItem("adminLevel");

  window.location.href = "login.html";

};


console.log(
  "✅ JAVASCRIPT DASHBOARD AKTIF"
);

</script>

</body>

</html>
