// ==================================================
// AMBIL DATA SISWA
// ==================================================

function ambilDataSiswa() {

  var body =
    document.getElementById(
      "bodySiswa"
    );


  if (!body) {
    return;
  }


  body.innerHTML = `

    <tr>

      <td
        colspan="5"
        style="
          padding:25px;
          text-align:center;
        "
      >
        ⏳ Mengambil data siswa...
      </td>

    </tr>

  `;


  var API_URL =
    "https://script.google.com/macros/s/AKfycbzF-dkz-qiprRO1UiBXip0LzojGuAAdGyvYuCYEVEiDbh0l1r5-uKfqkouPwzceK-bD/exec";


  fetch(
    API_URL +
    "?api=datasiswa"
  )

  .then(function(response) {

    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    return response.json();

  })

  .then(function(hasil) {

    console.log(
      "DATA SISWA:",
      hasil
    );


    if (
      !hasil ||
      hasil.status !== true
    ) {

      throw new Error(
        hasil && hasil.pesan
          ? hasil.pesan
          : "Data siswa gagal diambil."
      );

    }


    dataSiswaGlobal =
      hasil.siswa || [];


    var jumlah =
      document.getElementById(
        "jumlahSiswa"
      );


    if (jumlah) {

      jumlah.innerHTML =
        "👨‍🎓 Total Siswa: " +
        dataSiswaGlobal.length;

    }


    tampilkanSiswa(
      dataSiswaGlobal
    );

  })

  .catch(function(error) {

    console.error(
      "ERROR DATA SISWA:",
      error
    );


    body.innerHTML = `

      <tr>

        <td
          colspan="5"
          style="
            padding:25px;
            text-align:center;
            color:red;
            font-weight:bold;
          "
        >

          ❌ Gagal mengambil data siswa.

          <br><br>

          ${error.message}

        </td>

      </tr>

    `;

  });

}


// ==================================================
// TAMPILKAN DATA SISWA
// ==================================================

function tampilkanSiswa(data) {

  var body =
    document.getElementById(
      "bodySiswa"
    );


  if (!body) {
    return;
  }


  if (
    !data ||
    data.length === 0
  ) {

    body.innerHTML = `

      <tr>

        <td
          colspan="5"
          style="
            padding:25px;
            text-align:center;
          "
        >
          Data siswa tidak ditemukan.
        </td>

      </tr>

    `;

    return;

  }


  var html = "";


  data.forEach(
    function(siswa, index) {

      html += `

        <tr
          style="
            border-bottom:1px solid #ddd;
          "
        >

          <td
            style="
              padding:10px;
              text-align:center;
            "
          >
            ${index + 1}
          </td>


          <td style="padding:10px">
            ${siswa.nis || ""}
          </td>


          <td
            style="
              padding:10px;
              font-weight:bold;
            "
          >
            ${siswa.nama || ""}
          </td>


          <td
            style="
              padding:10px;
              text-align:center;
            "
          >
            ${siswa.jk || ""}
          </td>


          <td
            style="
              padding:10px;
              text-align:center;
            "
          >
            ${siswa.kelas || ""}
          </td>

        </tr>

      `;

    }
  );


  body.innerHTML =
    html;

}


// ==================================================
// PENCARIAN SISWA
// ==================================================

window.filterSiswa = function () {

  var input =
    document.getElementById(
      "cariSiswa"
    );


  if (!input) {
    return;
  }


  var keyword =
    input.value
      .toLowerCase()
      .trim();


  var hasil =
    dataSiswaGlobal.filter(
      function(siswa) {

        var nis =
          String(
            siswa.nis || ""
          ).toLowerCase();


        var nama =
          String(
            siswa.nama || ""
          ).toLowerCase();


        var kelas =
          String(
            siswa.kelas || ""
          ).toLowerCase();


        return (
          nis.includes(keyword) ||
          nama.includes(keyword) ||
          kelas.includes(keyword)
        );

      }
    );


  tampilkanSiswa(
    hasil
  );

};

const API_ABSENSI_FINAL =
  "https://script.google.com/macros/s/AKfycbzF-dkz-qiprRO1UiBXip0LzojGuAAdGyvYuCYEVEiDbh0l1r5-uKfqkouPwzceK-bD/exec";
let DATA_ABSENSI_FINAL = [];
let DATA_SISWA_FINAL = [];
let PERIODE_ABSENSI_FINAL = { start: null, end: null, label: "" };


function siapkanTanggalAbsensiFinal() {

  var now = new Date();
  var iso = formatInputDateAbsensiFinal(now);

  var inputMinggu = document.getElementById("tanggalMingguFinal");
  var inputBulan = document.getElementById("bulanAbsensiFinal");
  var inputTahun = document.getElementById("tahunSemesterFinal");

  if (inputMinggu) inputMinggu.value = iso;
  if (inputBulan) inputBulan.value = iso.substring(0, 7);

  var tahunAwal = now.getMonth() >= 6 ? now.getFullYear() : now.getFullYear() - 1;
  if (inputTahun) inputTahun.value = tahunAwal;

  ubahPeriodeAbsensiFinal();
}


function ubahPeriodeAbsensiFinal() {

  var periode = document.getElementById("periodeAbsensiFinal").value;

  var minggu = document.getElementById("filterMingguFinal");
  var bulan = document.getElementById("filterBulanFinal");
  var semester = document.getElementById("filterSemesterFinal");

  minggu.style.display = periode === "mingguan" ? "block" : "none";
  bulan.style.display = periode === "bulanan" ? "block" : "none";
  semester.style.display = (periode === "semester1" || periode === "semester2") ? "block" : "none";

  if (DATA_ABSENSI_FINAL.length) {
    renderDataAbsensiFinal();
  }
}


function muatDataAbsensiFinal() {

  var detail = document.querySelector("#tabelDetailAbsensiFinal tbody");
  if (detail) detail.innerHTML = '<tr><td colspan="9">⏳ Mengambil data dari server...</td></tr>';

  fetch(API_ABSENSI_FINAL + "?api=dataabsensi")
    .then(function(response) {
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    })
    .then(function(data) {

      if (!data || data.status !== true) {
        throw new Error(data && data.pesan ? data.pesan : "Data absensi tidak tersedia.");
      }

      DATA_ABSENSI_FINAL = Array.isArray(data.absensi) ? data.absensi : [];
      DATA_SISWA_FINAL = Array.isArray(data.siswa) ? data.siswa : [];

      isiFilterKelasAbsensiFinal();
      renderDataAbsensiFinal();
    })
    .catch(function(error) {
      console.error(error);
      if (detail) detail.innerHTML = '<tr><td colspan="9">❌ Gagal mengambil data absensi: ' + escapeStatistikFinal(error.message) + '</td></tr>';
      alert("Gagal mengambil data absensi.\n\n" + error.message);
    });
}


function isiFilterKelasAbsensiFinal() {

  var select = document.getElementById("kelasAbsensiFinal");
  if (!select) return;

  var kelas = {};
  DATA_SISWA_FINAL.forEach(function(s) {
    var k = String(s.kelas || "").trim();
    if (k) kelas[k] = true;
  });

  Object.keys(kelas).sort(naturalSortAbsensiFinal).forEach(function(k) {
    var option = document.createElement("option");
    option.value = k;
    option.textContent = k;
    select.appendChild(option);
  });
}


function renderDataAbsensiFinal() {

  if (!DATA_ABSENSI_FINAL.length && !DATA_SISWA_FINAL.length) return;

  PERIODE_ABSENSI_FINAL = ambilRentangAbsensiFinal();

  var kelas = document.getElementById("kelasAbsensiFinal").value;
  var keyword = (document.getElementById("cariAbsensiFinal").value || "").trim().toLowerCase();

  var siswaFilter = DATA_SISWA_FINAL.filter(function(s) {
    var cocokKelas = !kelas || String(s.kelas || "") === kelas;
    var teks = (String(s.nis || "") + " " + String(s.nama || "") + " " + String(s.kelas || "")).toLowerCase();
    return cocokKelas && (!keyword || teks.indexOf(keyword) !== -1);
  });

  var records = DATA_ABSENSI_FINAL.filter(function(r) {
    var tanggal = normalisasiTanggalAbsensiFinal(r.tanggal);
    if (!tanggal) return false;
    if (tanggal < PERIODE_ABSENSI_FINAL.start || tanggal > PERIODE_ABSENSI_FINAL.end) return false;
    if (kelas && String(r.kelas || "") !== kelas) return false;
    if (!keyword) return true;
    var teks = (String(r.nis || "") + " " + String(r.nama || "") + " " + String(r.kelas || "")).toLowerCase();
    return teks.indexOf(keyword) !== -1;
  });

  var aktif = hitungHariKerjaAbsensiFinal(PERIODE_ABSENSI_FINAL.start, PERIODE_ABSENSI_FINAL.end);
  var byNis = {};

  siswaFilter.forEach(function(s) {
    var nis = String(s.nis || "").trim();
    if (!nis) return;
    byNis[nis] = {
      nis: nis,
      nama: String(s.nama || ""),
      kelas: String(s.kelas || ""),
      hadirDates: {},
      hadir: 0,
      terlambat: 0,
      pulangCepat: 0,
      sesuai: 0
    };
  });

  records.forEach(function(r) {
    var nis = String(r.nis || "").trim();
    if (!byNis[nis]) {
      byNis[nis] = {
        nis: nis,
        nama: String(r.nama || ""),
        kelas: String(r.kelas || ""),
        hadirDates: {},
        hadir: 0,
        terlambat: 0,
        pulangCepat: 0,
        sesuai: 0
      };
    }

    var item = byNis[nis];
    var tgl = normalisasiTanggalAbsensiFinal(r.tanggal);
    if (tgl) item.hadirDates[tgl] = true;
    item.hadir++;

    var sm = String(r.statusMasuk || r.status || "").toUpperCase();
    var sp = String(r.statusPulang || "").toUpperCase();

    if (sm.indexOf("TERLAMBAT") !== -1) item.terlambat++;
    if (sp.indexOf("PULANG CEPAT") !== -1) item.pulangCepat++;
    if (sp.indexOf("SESUAI") !== -1) item.sesuai++;
  });

  var siswaRekap = Object.keys(byNis).map(function(nis) {
    var x = byNis[nis];
    x.tidakHadir = Math.max(0, aktif - Object.keys(x.hadirDates).length);
    return x;
  });

  siswaRekap.sort(function(a,b) {
    return naturalSortAbsensiFinal(a.kelas, b.kelas) || String(a.nama).localeCompare(String(b.nama));
  });

  var kelasMap = {};
  siswaRekap.forEach(function(s) {
    if (!kelasMap[s.kelas]) {
      kelasMap[s.kelas] = {
        kelas: s.kelas,
        siswa: 0,
        hadir: 0,
        tidakHadir: 0,
        terlambat: 0,
        pulangCepat: 0,
        sesuai: 0
      };
    }
    kelasMap[s.kelas].siswa++;
    kelasMap[s.kelas].hadir += s.hadir;
    kelasMap[s.kelas].tidakHadir += s.tidakHadir;
    kelasMap[s.kelas].terlambat += s.terlambat;
    kelasMap[s.kelas].pulangCepat += s.pulangCepat;
    kelasMap[s.kelas].sesuai += s.sesuai;
  });

  var kelasRekap = Object.keys(kelasMap).map(function(k) { return kelasMap[k]; });
  kelasRekap.sort(function(a,b) { return naturalSortAbsensiFinal(a.kelas, b.kelas); });

  var totalHadir = records.length;
  var totalTerlambat = records.filter(function(r) { return String(r.statusMasuk || r.status || "").toUpperCase().indexOf("TERLAMBAT") !== -1; }).length;
  var totalPulangCepat = records.filter(function(r) { return String(r.statusPulang || "").toUpperCase().indexOf("PULANG CEPAT") !== -1; }).length;
  var totalSesuai = records.filter(function(r) { return String(r.statusPulang || "").toUpperCase().indexOf("SESUAI") !== -1; }).length;
  var totalTidakHadir = siswaRekap.reduce(function(n, s) { return n + s.tidakHadir; }, 0);

  setStatistikFinal("rekapSiswaFinal", siswaRekap.length);
  setStatistikFinal("rekapHadirFinal", totalHadir);
  setStatistikFinal("rekapTerlambatFinal", totalTerlambat);
  setStatistikFinal("rekapPulangCepatFinal", totalPulangCepat);
  setStatistikFinal("rekapSesuaiFinal", totalSesuai);
  setStatistikFinal("rekapTidakHadirFinal", totalTidakHadir);
  setStatistikFinal("periodeLabelAbsensiFinal", PERIODE_ABSENSI_FINAL.label + " • Hari kerja dihitung: " + aktif);

  renderRekapKelasAbsensiFinal(kelasRekap);
  renderRekapSiswaAbsensiFinal(siswaRekap);
  renderDetailAbsensiFinal(records);
}


function ambilRentangAbsensiFinal() {

  var periode = document.getElementById("periodeAbsensiFinal").value;
  var start, end, label;

  if (periode === "mingguan") {
    var d = parseInputDateAbsensiFinal(document.getElementById("tanggalMingguFinal").value) || new Date();
    var day = d.getDay();
    var diff = day === 0 ? -6 : 1 - day;
    start = tambahHariAbsensiFinal(d, diff);
    end = tambahHariAbsensiFinal(start, 6);
    label = "Mingguan: " + tampilTanggalAbsensiFinal(start) + " s.d. " + tampilTanggalAbsensiFinal(end);
  }

  if (periode === "bulanan") {
    var val = document.getElementById("bulanAbsensiFinal").value;
    var parts = val.split("-");
    var y = Number(parts[0]) || new Date().getFullYear();
    var m = (Number(parts[1]) || (new Date().getMonth() + 1)) - 1;
    start = new Date(y, m, 1);
    end = new Date(y, m + 1, 0);
    label = "Bulanan: " + start.toLocaleDateString("id-ID", {month:"long", year:"numeric"});
  }

  if (periode === "semester1") {
    var ya = Number(document.getElementById("tahunSemesterFinal").value) || new Date().getFullYear();
    start = new Date(ya, 6, 1);
    end = new Date(ya, 11, 31);
    label = "Semester 1: Juli–Desember " + ya;
  }

  if (periode === "semester2") {
    var ya2 = Number(document.getElementById("tahunSemesterFinal").value) || new Date().getFullYear() - 1;
    start = new Date(ya2 + 1, 0, 1);
    end = new Date(ya2 + 1, 5, 30);
    label = "Semester 2: Januari–Juni " + (ya2 + 1);
  }

  return {
    start: formatInputDateAbsensiFinal(start),
    end: formatInputDateAbsensiFinal(end),
    label: label
  };
}

function formatNamaFileAbsensiFinal() {
  return (PERIODE_ABSENSI_FINAL.label || "periode")
    .replace(/[^a-zA-Z0-9]+/g, "_")
    .replace(/^_|_$/g, "");
}


function naturalSortAbsensiFinal(a, b) {
  return String(a).localeCompare(String(b), undefined, {numeric:true, sensitivity:"base"});
}


function formatInputDateAbsensiFinal(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, "0");
  var day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}


function parseInputDateAbsensiFinal(value) {
  if (!value) return null;
  var p = value.split("-").map(Number);
  return new Date(p[0], p[1] - 1, p[2]);
}


function tambahHariAbsensiFinal(d, n) {
  var x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}


function hitungHariKerjaAbsensiFinal(start, end) {
  var s = parseInputDateAbsensiFinal(start);
  var e = parseInputDateAbsensiFinal(end);
  var total = 0;
  for (var d = new Date(s); d <= e; d.setDate(d.getDate() + 1)) {
    var day = d.getDay();
    if (day !== 0 && day !== 6) total++;
  }
  return total;
}


function normalisasiTanggalAbsensiFinal(value) {
  if (!value) return "";
  var s = String(value);
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0,10);
  var d = new Date(value);
  return isNaN(d.getTime()) ? "" : formatInputDateAbsensiFinal(d);
}


function tampilTanggalAbsensiFinal(d) {
  return d.toLocaleDateString("id-ID", {day:"2-digit", month:"2-digit", year:"numeric"});
}


function tampilTanggalDariStringAbsensiFinal(value) {
  var d = parseInputDateAbsensiFinal(normalisasiTanggalAbsensiFinal(value));
  return d ? tampilTanggalAbsensiFinal(d) : value;
}

const API_STATISTIK_FINAL =
  "https://script.google.com/macros/s/AKfycbzF-dkz-qiprRO1UiBXip0LzojGuAAdGyvYuCYEVEiDbh0l1r5-uKfqkouPwzceK-bD/exec";


function muatStatistikFinal() {

  var tombol = document.getElementById("btnRefreshStatistikFinal");

  if (tombol) {
    tombol.disabled = true;
    tombol.innerHTML = "⏳ MEMUAT...";
  }

  fetch(API_STATISTIK_FINAL + "?api=statistik")
    .then(function(response) {
      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }
      return response.json();
    })
    .then(function(data) {

      console.log("DATA STATISTIK:", data);

      if (!data || data.status !== true) {
        throw new Error(
          data && data.pesan ? data.pesan :
          "Data statistik tidak tersedia."
        );
      }

      setStatistikFinal("statistikTanggalFinal", "Tanggal: " + (data.tanggal || "-"));
      setStatistikFinal("statTotalFinal", data.totalSiswa || 0);
      setStatistikFinal("statSudahAbsenFinal", data.sudahAbsen || 0);
      setStatistikFinal("statBelumAbsenFinal", data.belumAbsen || 0);
      setStatistikFinal("statTepatWaktuFinal", data.tepatWaktu || 0);
      setStatistikFinal("statTerlambatFinal", data.terlambat || 0);
      setStatistikFinal("statSudahPulangFinal", data.sudahPulang || 0);
      setStatistikFinal("statBelumPulangFinal", data.belumPulang || 0);
      setStatistikFinal("statPulangCepatFinal", data.pulangCepat || 0);
      setStatistikFinal("statSesuaiJadwalFinal", data.sesuaiJadwal || 0);

      tampilPerKelasFinal(data.perKelas || []);
      tampilDaftarFinal("tabelBelumAbsenFinal", "jumlahBelumAbsenFinal", data.daftarBelumAbsen || [], "Semua siswa sudah absen.");
      tampilDaftarFinal("tabelTerlambatFinal", "jumlahTerlambatFinal", data.daftarTerlambat || [], "Tidak ada siswa terlambat.");
      tampilDaftarFinal("tabelPulangCepatFinal", "jumlahPulangCepatFinal", data.daftarPulangCepat || [], "Tidak ada siswa pulang cepat.");

    })
    .catch(function(error) {
      console.error("ERROR STATISTIK:", error);
      alert("❌ Gagal mengambil data statistik.\n\n" + error.message);
    })
    .finally(function() {
      if (tombol) {
        tombol.disabled = false;
        tombol.innerHTML = "🔄 REFRESH DATA";
      }
    });
}


function setStatistikFinal(id, value) {
  var element = document.getElementById(id);
  if (element) element.textContent = value;
}


function tampilPerKelasFinal(data) {

  var tbody = document.querySelector("#tabelPerKelasFinal tbody");
  if (!tbody) return;

  tbody.innerHTML = "";

  if (!data || data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="9">Rekap per kelas belum tersedia dari API.</td></tr>`;
    return;
  }

  data.forEach(function(item, index) {

    var tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${index + 1}</td>
      <td><strong>${escapeStatistikFinal(item.kelas)}</strong></td>
      <td>${item.total || 0}</td>
      <td>${item.sudahAbsen || 0}</td>
      <td>${item.belumAbsen || 0}</td>
      <td>${item.tepatWaktu || 0}</td>
      <td>${item.terlambat || 0}</td>
      <td>${item.sudahPulang || 0}</td>
      <td>${item.belumPulang || 0}</td>
    `;

    tbody.appendChild(tr);
  });
}


function tampilDaftarFinal(tableId, jumlahId, data, pesanKosong) {

  var tbody = document.querySelector("#" + tableId + " tbody");
  if (!tbody) return;

  setStatistikFinal(jumlahId, data.length);
  tbody.innerHTML = "";

  if (!data || data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4">🟢 ${pesanKosong}</td></tr>`;
    return;
  }

  data.forEach(function(item, index) {

    var tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${index + 1}</td>
      <td>${escapeStatistikFinal(item.nis)}</td>
      <td style="text-align:left;">${escapeStatistikFinal(item.nama)}</td>
      <td>${escapeStatistikFinal(item.kelas)}</td>
    `;

    tbody.appendChild(tr);
  });
}


function escapeStatistikFinal(value) {

  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
